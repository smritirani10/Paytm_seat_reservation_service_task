# One command: docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seats
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seats"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/seats?sslmode=disable
      DB_MAX_CONNS: "40"
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      LOG_LEVEL: info
    # The app also retries the DB itself, so this ordering is a nicety, not a requirement.
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
