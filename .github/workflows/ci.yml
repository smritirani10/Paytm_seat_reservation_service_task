name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seats
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/seats?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: build + integration tests
        run: mvn -B test package
      - name: burst against a locally running server
        run: |
          DATABASE_URL=$TEST_DATABASE_URL java -Xmx256m -jar target/seat-reservation.jar > server.log 2>&1 &
          ./burst.sh http://localhost:8080 -concurrency 2000
      - run: docker build -t seat-reservation .
